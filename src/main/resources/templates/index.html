<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Dev Archive</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<header>
    <h1>📚 Dev Archive</h1>
    <p>나만의 개발 자료 저장소</p>
</header>

<main>

    <div class="search-row">

        <form
                class="search-box"
                th:action="@{/}"
                method="get">

            <input
                    type="search"
                    name="keyword"
                    th:value="${keyword}"
                    placeholder="제목, URL, 메모 검색..."
                    autocomplete="off">

            <button type="submit">
                검색
            </button>

            <a
                    class="search-reset-button"
                    th:if="${searching}"
                    th:href="@{/}">
                초기화
            </a>

        </form>

        <button
                class="category-add-button"
                type="button"
                onclick="openCategoryForm()">
            + 카테고리
        </button>

    </div>

    <div
            class="search-summary"
            th:if="${searching}">

        <strong th:text="|'${keyword}' 검색 결과|">
            검색 결과
        </strong>

        <span th:text="|${searchResultCount}개|">
        0개
    </span>

    </div>

    <form
            id="category-form"
            class="category-form"
            th:action="@{/categories}"
            method="post">

        <input
                type="text"
                name="name"
                maxlength="30"
                placeholder="카테고리 이름"
                required>

        <button type="submit">
            추가
        </button>

        <button
                type="button"
                class="cancel-button"
                onclick="closeCategoryForm()">
            취소
        </button>
    </form>

    <section class="card-container">

        <article
                class="card"
                th:each="category : ${categories}"
                th:if="${!searching
            or (
                archivesByCategory[category.id] != null
                and !archivesByCategory[category.id].isEmpty()
            )}">

            <div class="card-title-row">

                <h2>
                    <span th:text="${category.defaultCategory ? '📦' : '📁'}">
                        📁
                    </span>

                    <span th:text="${category.name}">
                        카테고리
                    </span>
                </h2>

                <div class="card-title-buttons">

                    <button
                            class="archive-add-button"
                            type="button"
                            th:data-category-id="${category.id}"
                            th:data-category-name="${category.name}"
                            onclick="openArchiveCreateModal(this)"
                            aria-label="자료 추가">
                        +
                    </button>

                    <form
                            th:if="${!category.defaultCategory}"
                            th:action="@{/categories/{id}/delete(id=${category.id})}"
                            method="post"
                            onsubmit="return confirm(
                                '카테고리를 삭제할까요?\n저장된 자료는 기타로 이동합니다.'
                            );">

                        <button
                                class="category-delete-button"
                                type="submit"
                                aria-label="카테고리 삭제">
                            ×
                        </button>

                    </form>

                </div>

            </div>

            <div class="archive-list">

                <div
                        class="archive-item"
                        th:each="archive :
                            ${archivesByCategory[category.id]}"
                        th:data-archive-id="${archive.id}">

                    <div class="archive-info">

                        <a
                                class="archive-title"
                                th:href="${archive.url}"
                                th:text="${archive.title}"
                                target="_blank"
                                rel="noopener noreferrer">
                            자료 제목
                        </a>

                        <p
                                class="archive-memo"
                                th:if="${archive.memo != null
                                    and !archive.memo.isBlank()}"
                                th:text="${archive.memo}">
                            메모
                        </p>

                    </div>

                    <div class="archive-actions">

                        <a
                                class="archive-action-button"
                                th:href="${archive.url}"
                                target="_blank"
                                rel="noopener noreferrer">
                            열기
                        </a>

                        <button
                                class="archive-action-button"
                                type="button"
                                th:data-archive-id="${archive.id}"
                                th:data-category-id="${category.id}"
                                th:data-category-name="${category.name}"
                                th:data-title="${archive.title}"
                                th:data-url="${archive.url}"
                                th:data-memo="${archive.memo}"
                                onclick="openArchiveEditModal(this)">
                            수정
                        </button>

                        <form
                                th:action="@{/archives/{id}/delete(id=${archive.id})}"
                                method="post"
                                onsubmit="return confirm(
                                    '이 자료를 삭제할까요?'
                                );">

                            <button
                                    class="archive-action-button delete"
                                    type="submit">
                                삭제
                            </button>

                        </form>

                    </div>

                </div>

                <p
                        class="empty-archive-message"
                        th:if="${archivesByCategory[category.id] == null
                            or archivesByCategory[category.id].isEmpty()}">
                    아직 저장된 자료가 없습니다.
                </p>

            </div>

            <div class="page">

                <button
                        class="page-button previous"
                        type="button"
                        onclick="moveCardPage(this, -1)">
                    ◀
                </button>

                <span class="page-indicator">
                    1 / 1
                </span>

                <button
                        class="page-button next"
                        type="button"
                        onclick="moveCardPage(this, 1)">
                    ▶
                </button>

            </div>

        </article>

    </section>

    <div
            class="no-search-result"
            th:if="${searching and searchResultCount == 0}">

        <div class="no-search-result-icon">
            🔎
        </div>

        <h2>검색 결과가 없습니다</h2>

        <p>
            다른 제목이나 URL, 메모 내용으로 검색해 보세요.
        </p>

    </div>

</main>

<div
        id="archive-modal"
        class="modal-overlay"
        onclick="closeModalOnOutside(event)">

    <div class="modal">

        <div class="modal-header">
            <h2 id="archive-modal-title">
                자료 추가
            </h2>

            <button
                    class="modal-close-button"
                    type="button"
                    onclick="closeArchiveModal()">
                ×
            </button>
        </div>

        <p
                id="selected-category-name"
                class="selected-category">
        </p>

        <form
                id="archive-form"
                method="post">

            <input
                    id="archive-category-id"
                    type="hidden"
                    name="categoryId">

            <label for="archive-title">
                제목
            </label>

            <input
                    id="archive-title"
                    type="text"
                    name="title"
                    maxlength="100"
                    placeholder="자료 제목"
                    required>

            <label for="archive-url">
                URL
            </label>

            <input
                    id="archive-url"
                    type="url"
                    name="url"
                    maxlength="1000"
                    placeholder="https://..."
                    required>

            <label for="archive-memo">
                메모
            </label>

            <textarea
                    id="archive-memo"
                    name="memo"
                    rows="7"
                    placeholder="다시 볼 때 필요한 내용을 적어 두세요."></textarea>

            <div class="modal-buttons">

                <button
                        class="modal-save-button"
                        type="submit">
                    저장
                </button>

                <button
                        class="modal-cancel-button"
                        type="button"
                        onclick="closeArchiveModal()">
                    취소
                </button>

            </div>

        </form>

    </div>

</div>

<script>
    const ITEMS_PER_PAGE = 4;

    const categoryForm =
        document.getElementById("category-form");

    const archiveModal =
        document.getElementById("archive-modal");

    const archiveForm =
        document.getElementById("archive-form");

    const archiveModalTitle =
        document.getElementById("archive-modal-title");

    const selectedCategoryName =
        document.getElementById("selected-category-name");

    const categoryIdInput =
        document.getElementById("archive-category-id");

    const titleInput =
        document.getElementById("archive-title");

    const urlInput =
        document.getElementById("archive-url");

    const memoInput =
        document.getElementById("archive-memo");

    function openCategoryForm() {
        categoryForm.classList.add("show");
        categoryForm.querySelector("input").focus();
    }

    function closeCategoryForm() {
        categoryForm.classList.remove("show");
        categoryForm.reset();
    }

    function openArchiveCreateModal(button) {
        archiveModalTitle.textContent = "자료 추가";

        archiveForm.action = "/archives";
        archiveForm.reset();

        categoryIdInput.value =
            button.dataset.categoryId;

        selectedCategoryName.textContent =
            button.dataset.categoryName + " 카테고리";

        archiveModal.classList.add("show");
        titleInput.focus();
    }

    function openArchiveEditModal(button) {
        archiveModalTitle.textContent = "자료 수정";

        archiveForm.action =
            "/archives/" +
            button.dataset.archiveId +
            "/update";

        categoryIdInput.value =
            button.dataset.categoryId;

        titleInput.value =
            button.dataset.title ?? "";

        urlInput.value =
            button.dataset.url ?? "";

        memoInput.value =
            button.dataset.memo ?? "";

        selectedCategoryName.textContent =
            button.dataset.categoryName + " 카테고리";

        archiveModal.classList.add("show");
        titleInput.focus();
    }

    function closeArchiveModal() {
        archiveModal.classList.remove("show");
        archiveForm.reset();
    }

    function closeModalOnOutside(event) {
        if (event.target === archiveModal) {
            closeArchiveModal();
        }
    }

    function initializeCardPagination() {
        document.querySelectorAll(".card")
            .forEach(card => {
                card.dataset.currentPage = "1";
                renderCardPage(card);
            });
    }

    function moveCardPage(button, direction) {
        const card = button.closest(".card");

        const items =
            card.querySelectorAll(".archive-item");

        const totalPages = Math.max(
            1,
            Math.ceil(items.length / ITEMS_PER_PAGE)
        );

        let currentPage =
            Number(card.dataset.currentPage || 1);

        currentPage += direction;

        if (currentPage < 1) {
            currentPage = 1;
        }

        if (currentPage > totalPages) {
            currentPage = totalPages;
        }

        card.dataset.currentPage =
            String(currentPage);

        renderCardPage(card);
    }

    function renderCardPage(card) {
        const items =
            Array.from(
                card.querySelectorAll(".archive-item")
            );

        const totalPages = Math.max(
            1,
            Math.ceil(items.length / ITEMS_PER_PAGE)
        );

        let currentPage =
            Number(card.dataset.currentPage || 1);

        if (currentPage > totalPages) {
            currentPage = totalPages;
        }

        const start =
            (currentPage - 1) * ITEMS_PER_PAGE;

        const end =
            start + ITEMS_PER_PAGE;

        items.forEach((item, index) => {
            item.style.display =
                index >= start && index < end
                    ? "flex"
                    : "none";
        });

        card.querySelector(".page-indicator")
            .textContent =
            currentPage + " / " + totalPages;

        card.querySelector(".previous")
            .disabled =
            currentPage === 1;

        card.querySelector(".next")
            .disabled =
            currentPage === totalPages;
    }

    document.addEventListener(
        "DOMContentLoaded",
        initializeCardPagination
    );
</script>

</body>

</html>
